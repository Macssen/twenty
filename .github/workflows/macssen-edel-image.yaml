# Macssen fork: zone-scope tests and the EDEL image (ghcr.io/macssen/twenty).
# Tag edel/v2.38.1-edel.N publishes ghcr.io/macssen/twenty:v2.38.1-edel.N.
name: Macssen EDEL image

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - 'edel/**'
    tags:
      - 'edel/v*'
  workflow_dispatch:

concurrency:
  group: macssen-edel-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  zone-scope-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      ZONE_SCOPE_ROLE: Zone Scope Seller
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Build dependencies
        run: |
          npx nx build twenty-shared
          npx nx build twenty-emails
      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c 'CREATE DATABASE "test";'
      - name: Reset and seed test database
        working-directory: packages/twenty-server
        run: NODE_OPTIONS="--max-old-space-size=12288 --import tsx/esm" npx nx database:reset > reset-logs.log
      # Zone-scope leak matrix, plus the upstream suites that exercise the
      # same hook (row-level permissions, relations, search, group-by).
      - name: Zone-scope and permission integration tests
        working-directory: packages/twenty-server
        run: >-
          NODE_OPTIONS="--max-old-space-size=6144"
          npx jest --config ./jest-integration.config.ts
          test/integration/zone-scope
          test/integration/graphql/suites
          test/integration/rest
          test/integration/twenty-orm

  image:
    if: startsWith(github.ref, 'refs/tags/edel/v') || github.event_name == 'workflow_dispatch'
    needs: zone-scope-tests
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Resolve image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/edel/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/edel/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edel-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          docker buildx create --use
          docker buildx build \
            --file packages/twenty-docker/twenty/Dockerfile \
            --target twenty \
            --platform linux/amd64 \
            --build-arg APP_VERSION="${{ steps.tag.outputs.value }}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.licenses="AGPL-3.0" \
            --tag "ghcr.io/${{ github.repository_owner }}/twenty:${{ steps.tag.outputs.value }}" \
            --push \
            .
